# Course schedule - single source of truth for the table on the home page.
# Source: course planning sheet, tab "group formation before intro presentations".
# Only PUBLIC columns are stored here (sheet columns A-G). The private planning
# columns (Tentative Speaker, internal notes) are intentionally NOT included.
#
# Fields per row:
#   week:        integer. Grouping label; shown once per week in the table.
#   class_no:    integer. Session number. Kept for reference; not rendered.
#   lecture_no:  integer. Running LECTURE count; shown as an "L#" badge.
#                Omit on activity-only days, holidays, and non-lecture sessions.
#   unit:        1-4. Course Part the session belongs to; drives the color rail.
#                (1 = Text as data, 2 = Navigating tools, 3 = Data curation and
#                 evaluation, 4 = Adapting models to domains.) Boundaries at the
#                transition classes are a judgment call -- easy to move.
#   date:        ISO YYYY-MM-DD. The home page formats it for display.
#   date_label:  free text, used INSTEAD of `date` when there is no fixed date.
#   lecture:     lecture topic (blank on activity-only days).
#   activity:    LIST of in-class activity items; each renders on its own line.
#                Markdown is allowed, so you can add links later.
#   assignments: LIST of release/due items; each on its own line. Markdown OK.
#                Deadlines are 11:59pm ET (stated once above the table).
#                An item may be a plain string, OR an object to attach a badge:
#                  - text: "Lab 1 released"
#                    tag: lab      # renders a "lab" pill
#                Use tag: lab for Lab items, tag: prj for course-project items.
#   readings:    LIST of readings / resources; each on its own line. Markdown OK.
#   slides:      optional path, e.g. /assets/slides/2026-08-25-intro.pdf.
#                When present, a "(slides)" link appears next to the lecture.
#   no_class:    true renders the row's lecture in italics (breaks, holidays).

