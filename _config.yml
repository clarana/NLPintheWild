title: "11-811: Interdisciplinary NLP"
description: "Language Modeling in the Wild · Fall 2026"
url: "https://nlpinthewild.clarasna.com"
baseurl: ""

# Shown in the dark site header and footer
institution: "Carnegie Mellon University · Language Technologies Institute"
# Used for the "Edit this page on GitHub" footer link
repository: "clarana/NLPintheWild"

# Right-aligned external links in the top nav. Replace "#" with the real URLs.
external_links:
  - name: Canvas
    url: "#"
  - name: Piazza
    url: "https://piazza.com/class/mshlvaz248d7f5/"

# ---------------------------------------------------------------------------
# Assignments collection — Lab 1–4 + the project. Each becomes a page under the
# "Labs" dropdown in the top nav; ordering/label come from each file's front matter.
# ---------------------------------------------------------------------------
collections:
  labs:
    output: true
    permalink: "/labs/:name/"
  # One readings page per class meeting. Name the file for the class date
  # (_readings/2026-08-27.md) so it lands at /readings/2026-08-27/, and set
  # `class_date` in its front matter so the schedule table can find it.
  readings:
    output: true
    permalink: "/readings/:name/"

defaults:
  - scope:
      path: ""
      type: labs
    values:
      layout: lab
  - scope:
      path: ""
      type: readings
    values:
      layout: reading

# On the home page, an assignment's summary = everything ABOVE this marker in its
# file; the full page = the whole file. Edit one file, both stay in sync.
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build excludes (never exclude CNAME — it sets the custom domain)
exclude:
  - docs/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/
