title: "11-811: Interdisciplinary NLP"

# `tagline` is the line under the title in the site header. `description` is the
# SEO/social one (meta description, og:description) and never appears on screen,
# so it can spell the course number both ways for search.
tagline: "Language Modeling in the Wild &#124; Fall 2026"   # &#124; is a pipe; a literal | here gets eaten by jekyll-seo-tag (kramdown reads it as a table)
description: "CMU 11-811 (11811), Interdisciplinary NLP: Language Modeling in the Wild. Carnegie Mellon University, Language Technologies Institute, Fall 2026."

# Course number in both spellings. People search the unhyphenated "11811", so it
# has to appear literally in the title, the metadata, and the page text.
course_number: "11-811"
course_number_alt: "11811"
keywords: "11811, 11-811, CMU 11811, CMU 11-811, 11811 CMU, Interdisciplinary NLP, Language Modeling in the Wild, LTI, Carnegie Mellon, NLP course, Fall 2026"
url: "https://nlpinthewild.clarasna.com"
baseurl: ""

# Shown in the dark site header and footer
institution: "Carnegie Mellon University | Language Technologies Institute"
# Used for the "Edit this page on GitHub" footer link
repository: "clarana/NLPintheWild"

# Right-aligned external links in the top nav. Replace "#" with the real URLs.
external_links:
  - name: Canvas
    url: "https://canvas.cmu.edu/courses/56179"
  - name: Piazza
    url: "https://piazza.com/class/mshlvaz248d7f5/"

# ---------------------------------------------------------------------------
# Assignments collection — Lab 1–4 + the project. Each becomes a page under the
# "Labs" dropdown in the top nav; ordering/label come from each file's front matter.
# ---------------------------------------------------------------------------
collections:
  labs:
    output: true
    permalink: "/labs/:name/"
  # One readings page per class meeting. Name the file for the class date
  # (_readings/2026-08-27.md) so it lands at /readings/2026-08-27/, and set
  # `class_date` in its front matter so the schedule table can find it.
  readings:
    output: true
    permalink: "/readings/:name/"

defaults:
  - scope:
      path: ""
      type: labs
    values:
      layout: lab
  - scope:
      path: ""
      type: readings
    values:
      layout: reading

# On the home page, an assignment's summary = everything ABOVE this marker in its
# file; the full page = the whole file. Edit one file, both stay in sync.
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build excludes (never exclude CNAME — it sets the custom domain)
exclude:
  - docs/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/
